name: Linux

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Stage bundled hymnals
        run: |
          mkdir -p build/content-standard/hymnals
          cp -a hymnals/adventist-1-afrikaans hymnals/adventist-2-english-new build/content-standard/hymnals/
      - name: Build the AppImage
        run: npm run dist:linux
      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Upload to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.version.outputs.version }}" dist/standard/Orion-*-linux.AppImage --clobber
