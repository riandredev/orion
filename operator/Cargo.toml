[package]
name = "orion-operator"
version = "0.1.0"
edition = "2021"
description = "Native Orion desk window"

[[bin]]
name = "orion-operator"
path = "src/main.rs"

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
serde_json = "1"
slint = "1"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[build-dependencies]
slint-build = "1"
