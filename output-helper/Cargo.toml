[package]
name = "orion-output"
version = "0.1.0"
edition = "2021"
description = "Fullscreen GPU outputs for Orion"

[[bin]]
name = "orion-output"
path = "src/main.rs"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "24"
winit = "0.30"
